<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page Not Found</title>
  <style>
    /* Minimal style — only essential text and whitespace */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e1e1e;
      padding: 1.5rem;
    }

    .container {
      text-align: center;
      max-width: 32rem;
      width: 100%;
    }

    .code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #111;
      /* Minimal, no decoration — just the numbers */
      margin-bottom: 0.5rem;
      font-feature-settings: "tnum";
    }

    .message {
      font-size: 1.25rem;
      font-weight: 400;
      color: #555;
      margin-bottom: 2rem;
      letter-spacing: 0.02em;
    }

    .link {
      display: inline-block;
      font-size: 1rem;
      color: #111;
      text-decoration: none;
      padding: 0.6rem 1.8rem;
      border: 1px solid #ccc;
      border-radius: 2rem;
      background: transparent;
      transition: all 0.2s ease;
      font-weight: 400;
      letter-spacing: 0.3px;
      /* Minimal button — just border and subtle interaction */
    }

    .link:hover {
      background-color: #111;
      color: #fafafa;
      border-color: #111;
    }

    .link:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .link {
        transition: none;
      }
    }

    /* Keep small screens comfortable */
    @media (max-width: 480px) {
      .message {
        font-size: 1rem;
        margin-bottom: 1.75rem;
      }
      .link {
        padding: 0.5rem 1.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <p class="message">Page not found</p>
    <a href="/" class="link">Go home</a>
  </div>
</body>
</html>
