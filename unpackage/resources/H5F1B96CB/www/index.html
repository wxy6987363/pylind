<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Pylind</title>

		<script type='importmap'>
			{
			"imports": {
				"pyodide": "https://cdn.jsdelivr.net/pyodide/v314.0.5/full/pyodide.mjs",
				"xterm": "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.mjs",
				"xterm/addon-fit": "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.mjs",
				"xterm/addon-web-links": "https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/lib/addon-web-links.mjs"
			}
		}
	</script>

		<!-- CodeMirror -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/theme/monokai.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/theme/idea.min.css">

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.min.css" />

		<link rel="stylesheet" href="css/main.css" />
	</head>
	<body>
		<!-- 文件列表视图 -->
		<div id="file-list-view">
			<div class="header">
				<h2>Files</h2>
				<div class="actions">
					<button id="pypi-btn" title="PyPI">
						<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none"
							xmlns="http://www.w3.org/2000/svg">
							<path d="M24 4L4 14L24 24L44 14L24 4Z" stroke="currentColor" stroke-width="4"
								stroke-linejoin="round" />
							<path d="M4 34L24 44L44 34" stroke="currentColor" stroke-width="4" stroke-linecap="round"
								stroke-linejoin="round" />
							<path d="M4 24L24 34L44 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"
								stroke-linejoin="round" />
						</svg>
					</button>
					<button id="about-btn" title="About">
						<svg width="1em" height="1em" viewBox="0 0 48 48" fill="none"
							xmlns="http://www.w3.org/2000/svg">
							<path
								d="M10 14C12.2091 14 14 12.2091 14 10C14 7.79086 12.2091 6 10 6C7.79086 6 6 7.79086 6 10C6 12.2091 7.79086 14 10 14Z"
								fill="currentColor" />
							<path
								d="M24 14C26.2091 14 28 12.2091 28 10C28 7.79086 26.2091 6 24 6C21.7909 6 20 7.79086 20 10C20 12.2091 21.7909 14 24 14Z"
								fill="currentColor" />
							<path
								d="M38 14C40.2091 14 42 12.2091 42 10C42 7.79086 40.2091 6 38 6C35.7909 6 34 7.79086 34 10C34 12.2091 35.7909 14 38 14Z"
								fill="currentColor" />
							<path
								d="M10 28C12.2091 28 14 26.2091 14 24C14 21.7909 12.2091 20 10 20C7.79086 20 6 21.7909 6 24C6 26.2091 7.79086 28 10 28Z"
								fill="currentColor" />
							<path
								d="M24 28C26.2091 28 28 26.2091 28 24C28 21.7909 26.2091 20 24 20C21.7909 20 20 21.7909 20 24C20 26.2091 21.7909 28 24 28Z"
								fill="currentColor" />
							<path
								d="M38 28C40.2091 28 42 26.2091 42 24C42 21.7909 40.2091 20 38 20C35.7909 20 34 21.7909 34 24C34 26.2091 35.7909 28 38 28Z"
								fill="currentColor" />
							<path
								d="M10 42C12.2091 42 14 40.2091 14 38C14 35.7909 12.2091 34 10 34C7.79086 34 6 35.7909 6 38C6 40.2091 7.79086 42 10 42Z"
								fill="currentColor" />
							<path
								d="M24 42C26.2091 42 28 40.2091 28 38C28 35.7909 26.2091 34 24 34C21.7909 34 20 35.7909 20 38C20 40.2091 21.7909 42 24 42Z"
								fill="currentColor" />
							<path
								d="M38 42C40.2091 42 42 40.2091 42 38C42 35.7909 40.2091 34 38 34C35.7909 34 34 35.7909 34 38C34 40.2091 35.7909 42 38 42Z"
								fill="currentColor" />
						</svg>
					</button>
					<button id="import-file-btn" title="Import File">
						<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none"
							xmlns="http://www.w3.org/2000/svg">
							<path
								d="M24 43.9998H10C8.89543 43.9998 8 43.1043 8 41.9998V5.99976C8 4.89519 8.89543 3.99976 10 3.99976H38C39.1046 3.99976 40 4.89519 40 5.99976V23.9998"
								stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
							<path d="M35.5 43.9998V30.9998" stroke="currentColor" stroke-width="4"
								stroke-linecap="round" stroke-linejoin="round" />
							<path d="M31 34.4998L32.5 32.9998L35.5 29.9998L38.5 32.9998L40 34.4998"
								stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
							<path d="M16 15.9998H32" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
							<path d="M16 23.9998H24" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
						</svg>
					</button>
				</div>
			</div>
			<button id="new-file-btn" title="New File">
				<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path
						d="M10 44H38C39.1046 44 40 43.1046 40 42V14H30V4H10C8.89543 4 8 4.89543 8 6V42C8 43.1046 8.89543 44 10 44Z"
						fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"
						stroke-linejoin="round" />
					<path d="M30 4L40 14" stroke="currentColor" stroke-width="4" stroke-linecap="round"
						stroke-linejoin="round" />
					<path d="M24 21V35" stroke="currentColor" stroke-width="4" stroke-linecap="round"
						stroke-linejoin="round" />
					<path d="M17 28H24L31 28" stroke="currentColor" stroke-width="4" stroke-linecap="round"
						stroke-linejoin="round" />
				</svg>
			</button>
			<div class="file-grid" id="file-grid"></div>
		</div>

		<!-- 关于视图 -->
		<div id="about-view">
			<div class="topbar">
				<button class="back-btn">
					<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M5.79889 24H41.7989" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M17.7988 36L5.79883 24L17.7988 12" stroke="currentColor" stroke-width="4"
							stroke-linecap="round" stroke-linejoin="round" />
					</svg>
				</button>
				<h2>About</h2>
			</div>

			<div class="about-content">
				<div class='about-icon' id='about-icon'>
					<img src="res/1024.png" />
					<div>Pylind</div>
				</div>
				<div id="share-btn" class="share-btn" title="Share App">
					<svg width="1em" height="1em" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path
							d="M35 16C37.7614 16 40 13.7614 40 11C40 8.23858 37.7614 6 35 6C32.2386 6 30 8.23858 30 11C30 13.7614 32.2386 16 35 16Z"
							fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
						<path
							d="M13 29C15.7614 29 18 26.7614 18 24C18 21.2386 15.7614 19 13 19C10.2386 19 8 21.2386 8 24C8 26.7614 10.2386 29 13 29Z"
							fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
						<path d="M30.0004 13.5745L17.3393 21.2454" stroke="currentColor" stroke-width="4"
							stroke-linecap="round" stroke-linejoin="round" />
						<path d="M17.3385 26.5639L30.6789 34.4469" stroke="currentColor" stroke-width="4"
							stroke-linecap="round" stroke-linejoin="round" />
						<path
							d="M35 32C37.7614 32 40 34.2386 40 37C40 39.7614 37.7614 42 35 42C32.2386 42 30 39.7614 30 37C30 34.2386 32.2386 32 35 32Z"
							fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
					</svg>
					<span>Share</span>
				</div>
			</div>
		</div>

		<!-- PyPI包管理视图 -->
		<div id="pypi-view">
			<div class="topbar">
				<button class="back-btn">
					<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M5.79889 24H41.7989" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M17.7988 36L5.79883 24L17.7988 12" stroke="currentColor" stroke-width="4"
							stroke-linecap="round" stroke-linejoin="round" />
					</svg>
				</button>
				<h2>PyPI Package Manager</h2>
			</div>
			<div class="pypi-search">
				<input type="text" id="package-search" placeholder="Enter the name to search (e.g. numpy, pandas)" />
				<button id="search-package-btn">
					<svg width="1em" height="1em" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path
							d="M21 38C30.3888 38 38 30.3888 38 21C38 11.6112 30.3888 4 21 4C11.6112 4 4 11.6112 4 21C4 30.3888 11.6112 38 21 38Z"
							fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
						<path
							d="M26.657 14.3431C25.2093 12.8954 23.2093 12 21.0001 12C18.791 12 16.791 12.8954 15.3433 14.3431"
							stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
						<path d="M33.2216 33.2217L41.7069 41.707" stroke="currentColor" stroke-width="4"
							stroke-linecap="round" stroke-linejoin="round" />
					</svg>
				</button>
				<button id="barcode-btn">
					<svg width="1em" height="1em" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M6 15V6H15" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M15 42H6V33" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M42 33V42H33" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M33 6H42V15" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M10 24H38" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
					</svg>
				</button>
			</div>
			<div class="pypi-results" id="pypi-results"></div>
			<div class="installed-packages">
				<h3>Installed Packages</h3>
				<div id="installed-packages-list"></div>
			</div>
		</div>

		<!-- 编辑器视图 -->
		<div id="edit-view">
			<div class="topbar">
				<button class="back-btn">
					<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M5.79889 24H41.7989" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M17.7988 36L5.79883 24L17.7988 12" stroke="currentColor" stroke-width="4"
							stroke-linecap="round" stroke-linejoin="round" />
					</svg>
				</button>
				<span class="title" id="editor-title">Unnamed File</span>
				<div class="btn-group">
					<button id="save-btn">
						<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none"
							xmlns="http://www.w3.org/2000/svg">
							<path
								d="M6 9C6 7.34315 7.34315 6 9 6H34.2814L42 13.2065V39C42 40.6569 40.6569 42 39 42H9C7.34315 42 6 40.6569 6 39V9Z"
								fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
							<path fill-rule="evenodd" clip-rule="evenodd"
								d="M24.0083 6L24 13.3846C24 13.7245 23.5523 14 23 14H15C14.4477 14 14 13.7245 14 13.3846L14 6"
								fill="none" />
							<path
								d="M24.0083 6L24 13.3846C24 13.7245 23.5523 14 23 14H15C14.4477 14 14 13.7245 14 13.3846L14 6H24.0083Z"
								stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
							<path d="M9 6H34.2814" stroke="currentColor" stroke-width="4" stroke-linecap="round"
								stroke-linejoin="round" />
							<path d="M14 26H34" stroke="currentColor" stroke-width="4" stroke-linecap="round"
								stroke-linejoin="round" />
							<path d="M14 34H24.0083" stroke="currentColor" stroke-width="4" stroke-linecap="round"
								stroke-linejoin="round" />
						</svg>
					</button>
					<button class="run-btn" id="run-btn">
						<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none"
							xmlns="http://www.w3.org/2000/svg">
							<path fill-rule="evenodd" clip-rule="evenodd"
								d="M41.0103 25.7308C42.3409 24.9605 42.3409 23.0395 41.0103 22.2691L9.00212 3.73804C7.66866 2.96611 6 3.92823 6 5.4689V42.5311C6 44.0718 7.66866 45.0339 9.00212 44.262L41.0103 25.7308Z"
								fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linecap="round"
								stroke-linejoin="round" />
						</svg>
					</button>
				</div>
			</div>
			<textarea id="code-area" style='display:none;'>print("Hello, World!")</textarea>
		</div>

		<!-- 终端覆盖层 -->
		<div id="console-overlay">
			<div class="topbar">
				<span class="title">Debug Console</span>
				<button class="close-btn" id="close-console-btn">
					<svg width='1em' height='1em' viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M8 8L40 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
						<path d="M8 40L40 8" stroke="currentColor" stroke-width="4" stroke-linecap="round"
							stroke-linejoin="round" />
					</svg>
				</button>
			</div>
			<div id="terminal-container"></div>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/python/python.min.js"></script>

		<script src="js/main.js" type="module"></script>
	</body>
</html>
